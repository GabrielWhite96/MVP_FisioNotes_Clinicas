<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Confirme que é você</title>
  </head>
  <body style="margin:0;padding:0;background:#07241e;">
    <div lang="pt-BR" dir="ltr" style="display:none;max-height:0;overflow:hidden;opacity:0;">Use o código para continuar no Fisionotes.</div>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#07241e;">
      <tr>
        <td style="height:5px;background:#1aa7a1;font-size:0;line-height:0;">&nbsp;</td>
      </tr>
      <tr>
        <td align="center" style="padding:28px 14px 36px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="width:100%;max-width:560px;">
            <tr>
              <td style="padding:0 8px 18px;">
                <img src="{{ .SiteURL }}/logos/logo_semfundo_com_nome_horizontal.png" alt="Fisionotes" height="36" style="height:36px;width:auto;max-width:220px;display:block;border:0;outline:none;" />
                <p style="margin:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#9fc4bc;">Voltar a se mover.</p>
              </td>
            </tr>
            <tr>
              <td style="background:#f6fbf8;border-radius:28px 18px 18px 18px;overflow:hidden;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td width="8" style="width:8px;background:#1aa7a1;font-size:0;line-height:0;">&nbsp;</td>
                    <td style="padding:32px 28px 30px 24px;">
                      <h1 style="margin:0 0 16px;font-family:Georgia,'Palatino Linotype',Palatino,serif;font-size:28px;line-height:1.15;color:#07241e;font-weight:normal;">Confirme que é você</h1>
                      <p style="margin:0 0 14px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.55;color:#3f5c54;">Para concluir esta ação, use o código abaixo.</p><p style="margin:8px 0 22px;padding:16px 12px;text-align:center;font-family:Consolas,'Courier New',monospace;font-size:28px;letter-spacing:0.18em;color:#07241e;background:#eaf2ee;border-radius:14px;">{{ .Token }}</p>
                      
                      <p style="margin:22px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#3f5c54;">O código expira em breve. Se você não pediu isso, ignore o e-mail.</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 8px 0;">
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#9fc4bc;">
                  Fisionotes · fisioterapia, treino e consulta no ritmo do seu corpo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
