[build]
  command = "npm run build"
  publish = "dist"

# Vite embeds these in the client bundle on purpose (Supabase anon/publishable keys).
# Omit them from Netlify secrets scanning so production builds don't fail.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
